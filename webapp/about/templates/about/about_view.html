{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Server CCTV</title>
    <!-- Font Awesome untuk ikon -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="{% static 'css/base.css' %}" />
    <style>
      /* Reset Default Styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }

      /* Body dan Layout Utama */
      html,
      body {
        height: 100%;
        background: #1c2526;
        color: #e0e0e0;
        font-size: 14px;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      .dashboard-container {
        display: flex;
        min-height: 100vh;
      }

      /* Sidebar (Sama persis dengan kode Anda) */
      .sidebar {
        width: 150px;
        background: #252f30;
        padding: 20px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .logo {
        font-size: 24px;
        color: #ffd700;
        margin-bottom: 40px;
      }

      .sidebar-menu {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      a {
        text-decoration: none;
      }

      .menu-item {
        color: #a0a0a0;
        font-size: 20px;
        transition: color 0.3s ease;
      }

      .menu-item:hover,
      .menu-item.active {
        color: #ffd700;
      }

      /* Main Content */
      .content-wrapper {
        flex: 1;
        padding: 20px;
        margin-left: 150px; /* Sesuaikan dengan lebar sidebar */
      }

      .content-wrapper h2 {
        font-size: 28px;
        font-weight: 600;
        text-align: center;
        margin-bottom: 20px;
        color: #f5f5f5;
      }

      /* Dropdown */
      .text-center {
        margin-top: 20px;
      }

      .form-label {
        font-size: 16px;
        color: #f5f5f5;
        margin-bottom: 8px;
      }

      .form-select {
        background-color: #252f30;
        color: #f5f5f5;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 10px;
        font-size: 14px;
        transition: border-color 0.3s ease;
      }

      .form-select:focus {
        border-color: #ffd700;
        box-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
        outline: none;
      }

      .form-select option {
        background-color: #252f30;
        color: #f5f5f5;
      }

      /* CCTV Feed */
      .cctv-container {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 30px;
      }

      .cctv-feed {
        width: 800px;
        height: 450px;
        background-color: #000;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        position: relative;
        transition: transform 0.3s ease;
      }

      .cctv-feed:hover {
        transform: scale(1.02);
      }

      .cctv-feed img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Footer */
      footer {
        background-color: #212529;
        padding: 1rem 0;
        text-align: center;
        color: #ccc;
        font-size: 14px;
        margin-top: auto;
      }

      /* Responsivitas */
      @media (max-width: 992px) {
        .content-wrapper {
          margin-left: 150px; /* Tetap 150px karena sidebar tidak berubah */
        }

        .cctv-feed {
          width: 600px;
          height: 337.5px; /* Maintain aspect ratio 16:9 */
        }
      }

      @media (max-width: 768px) {
        .sidebar {
          width: 50px;
        }

        .content-wrapper {
          margin-left: 50px;
          padding: 15px;
        }

        .cctv-feed {
          width: 100%;
          height: auto;
          aspect-ratio: 16 / 9;
        }
      }

      @media (max-width: 576px) {
        .content-wrapper h2 {
          font-size: 22px;
        }

        .form-select {
          width: 100% !important;
        }

        footer {
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="dashboard-container">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="logo">
          <i class="fas fa-star"></i>
        </div>
        <div class="sidebar-menu">
          <a href="{% url 'dashbord' %}" class="menu-item">Dashboard</a>
          <a href="{% url 'about_view' %}" class="menu-item active">CCTV</a>
          <a href="{% url 'apd_report' %}" class="menu-item">APD Report</a>
          <a href="{% url 'logout' %}" class="menu-item">
            <i class="fas fa-sign-out-alt"></i>
          </a>
        </div>
      </div>

      <!-- Main Content -->
      <div class="content-wrapper container mt-4">
        <h2 class="text-center">Live Server CCTV</h2>

        <!-- Dropdown -->
        <div class="text-center mt-3">
          <label for="cctvSelect" class="form-label">Pilih CCTV:</label>
          <select id="cctvSelect" class="form-select w-50 mx-auto">
            <option disabled selected>Pilih Area</option>
            <option value="0">CCTV 1 - Area Masuk Kendaraan</option>
            <option value="1">CCTV 2 - Area Masuk 2</option>
          </select>
        </div>

        <!-- Video Stream -->
        <div class="cctv-container">
          <div class="cctv-feed">
            <!-- Placeholder image -->
            <img
              id="video-stream"
              src="{% static 'img/safe.png' %}"
              alt="Silakan pilih CCTV dari dropdown di atas"
              loading="lazy"
            />
          </div>
        </div>
      </div>
    </div>

    <!-- Sticky Footer -->
    <footer>
      <p>© 2025 CCTV Monitoring. All Rights Reserved.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Dropdown to Change Feed -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const cctvSelect = document.getElementById("cctvSelect");
        const videoStream = document.getElementById("video-stream");

        function updateVideoSource() {
          const selectedIndex = cctvSelect.value;
          const timestamp = new Date().getTime(); // cache buster
          videoStream.src = `/video_feed/${selectedIndex}/?t=${timestamp}`;
        }

        cctvSelect.addEventListener("change", updateVideoSource);
      });
    </script>
  </body>
</html>
