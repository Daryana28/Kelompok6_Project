<!DOCTYPE html>
<html lang="id">
  <head>
    {% load static %}
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Server CCTV</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"/>
    <link rel="stylesheet" href="{% static 'css/server.css' %}" />

    <style>
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #121212;
        color: #f5f5f5;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      .content-wrapper {
        flex: 1;
      }

      .cctv-container {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 30px;
      }

      .cctv-feed {
        width: 800px;
        height: 450px;
        background-color: #000;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 0 10px rgba(0, 255, 128, 0.2);
      }

      .cctv-feed img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      footer {
        background-color: #212529;
        padding: 1rem 0;
        text-align: center;
        color: #ccc;
      }

      .navbar-nav .nav-link {
        transition: color 0.3s ease;
      }

      .navbar-nav .nav-link:hover {
        color: #9eff67 !important; 
      }

      .dropdown-menu .dropdown-item:hover {
        background-color: #333;
        color: #9eff67 !important;
      }
    </style>
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
      <div class="container">
        <a class="navbar-brand text-light" href="#">CCTV Monitoring</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link text-light" href="{% url 'dashbord' %}">Beranda</a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle text-light" href="#" data-bs-toggle="dropdown">Setting</a>
              <ul class="dropdown-menu bg-dark">
                <li><a class="dropdown-item text-light" href="#">Profile</a></li>
                <li><a class="dropdown-item text-light" href="{% url 'logout' %}">Log Out</a></li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="content-wrapper container mt-4">
      <h2 class="text-center">Live Server CCTV</h2>

      <!-- Dropdown -->
      <div class="text-center mt-3">
        <label for="cctvSelect" class="form-label">Pilih CCTV:</label>
        <select id="cctvSelect" class="form-select w-50 mx-auto">
          <option disabled selected>Pilih Area</option>
          <option value="0">CCTV 1 - Area Masuk Kendaraan</option>
          <option value="1">CCTV 2 - Area Masuk 2</option>
        </select>
      </div>

      <!-- Video Stream -->
      <div class="cctv-container">
        <div class="cctv-feed">
          <!-- Placeholder image -->
          <img
            id="video-stream"
            src="{% static 'img/safe.png' %}"
            alt="Silakan pilih CCTV dari dropdown di atas"
            loading="lazy"
          />
        </div>
      </div>
    </div>

    <!-- Sticky Footer -->
    <footer>
      <p>&copy; 2025 CCTV Monitoring. All Rights Reserved.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Dropdown to Change Feed -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const cctvSelect = document.getElementById("cctvSelect");
        const videoStream = document.getElementById("video-stream");

        function updateVideoSource() {
          const selectedIndex = cctvSelect.value;
          const timestamp = new Date().getTime(); // cache buster
          videoStream.src = `/video_feed/${selectedIndex}/?t=${timestamp}`;
        }

        cctvSelect.addEventListener("change", updateVideoSource);
      });
    </script>
  </body>
</html>
