{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <style>
      body {
        background-image: url("{% static 'img/drone.jpg' %}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        height: 100vh;
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        position: relative;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        background-color: rgba(0, 0, 0, 0.3);
        z-index: 1;
      }

      .login-wrapper {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        height: 100%;
        padding-right: 10%;
        position: relative;
        z-index: 2;
      }

      .login-box {
        background: rgba(169, 169, 169, 0.5);
        backdrop-filter: blur(8px);     
        -webkit-backdrop-filter: blur(8px);
        padding: 40px;
        border-radius: 10px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        color: white;
      }

      .login-title {
        font-weight: bold;
        text-align: center;
        margin-bottom: 30px;
        font-size: 24px;
        color: #fff;
      }

      .btn-login {
        background-color: #007bff;
        color: white;
      }

      .btn-login:hover {
        background-color: #0069d9;
      }

      .footer-link {
        font-size: 14px;
        display: flex;
        margin-top: 15px;
      }

      .brand {
        position: absolute;
        top: 20px;
        left: 40px;
        z-index: 3;
      }

      .brand img {
        height: 60px;
        width: auto;
        filter: drop-shadow(0 0 6px white);
      }

      .footer-text {
        position: absolute;
        bottom: 10px;
        width: 100%;
        text-align: center;
        font-size: 12px;
        color: white;
        z-index: 2;
      }

      .form-label {
        color: #ccc;
      }

      input {
        background-color: rgba(255, 255, 255, 0.9);
        color: #000;
      }

    </style>
  </head>
  <body>
    <!-- Logo ADW -->
    <div class="brand">
      <img src="{% static 'img/adw.png' %}" alt="SafeTech Logo" />
    </div>

    <!-- Login Form -->
    <div class="login-wrapper">
      <form method="post" class="login-box">
        {% csrf_token %}
        <div class="login-title">SafeTech</div>
      
        <div class="mb-3">
          <label for="username" class="form-label">User ID</label>
          {{ form.username }}
        </div>
      
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          {{ form.password }}
        </div>
      
        <button type="submit" class="btn btn-login w-100">Sign in</button>
      
        <div class="footer-link justify-content-end">
          <a href="#" style="color: #90caff;">Mobile App</a>
        </div>
      </form>
    </div>

    <!-- Footer -->
    <div class="footer-text">
      Build up an efficient and agile organization with ADW Safety Monitoring.<br />
      © 2025 SafeTech International Ltd. All Rights Reserved.
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
