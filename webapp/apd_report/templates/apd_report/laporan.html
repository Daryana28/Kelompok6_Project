<!-- your_app/apd_report/templates/apd_report/laporan.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Laporan APD</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"/>
    
</head>
<body >

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">
          <a class="navbar-brand text-light" href="#">Laporan</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link text-light" href="{% url 'dashbord' %}">Beranda</a>
              </li>
              <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle text-light" href="#" data-bs-toggle="dropdown">Setting</a>
                <ul class="dropdown-menu bg-dark">
                  <li><a class="dropdown-item text-light" href="#">Profile</a></li>
                  <li><a class="dropdown-item text-light" href="{% url 'logout' %}">Log Out</a></li>
                </ul>
              </li>
            </ul>
          </div>
        </div>
      </nav>

        <div class="flex justify-content-center align-items-center" style="height: 100vh; text-align: center;">
            <div>
                <h1 style="font-size: 2.5rem; color: #333;">Coming Soon</h1>
                <p style="font-size: 1.2rem; color: #666;">We're working hard to bring you something amazing. Stay tuned!</p>
            </div>
        </div>
        
        <tbody>

            

            {% for item in pelanggaran %}
            <tr>
                <td>{{ item.waktu }}</td>
                <td>{{ item.lokasi }}</td>
                <td>{{ item.jenis_pelanggaran }}</td>
                <td>{{ item.tindakan }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
